# pre-commit hooks. Hooks managed by repo-guardrails are upserted; add your own freely.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit]
  # --- any change under .github/: fmt -> lint -> security -> act -----------
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
        name: "gh actions 1/4: fmt (yamlfmt)"
        files: ^\.github/.*\.ya?ml$
        stages: [pre-commit]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        name: "gh actions 2/4: lint (actionlint)"
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: act-validate
        name: "gh actions 2/4: lint (act --validate)"
        entry: act --validate
        language: system
        files: ^\.github/
        pass_filenames: false
        stages: [pre-commit]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
        name: "gh actions 3/4: security (zizmor)"
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: act-dryrun
        name: "gh actions 4/4: act dry run"
        entry: act --dryrun push
        language: system
        files: ^\.github/
        pass_filenames: false
        stages: [pre-commit]
  # --- secret scanning -------------------------------------------------------
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --staged --redact --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: trufflehog
        name: trufflehog (staged files)
        entry: .github/scripts/trufflehog-scan.sh files
        language: system
        stages: [pre-commit]
      - id: gitleaks-push
        name: gitleaks (commits being pushed)
        entry: bash -c 'gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="${PRE_COMMIT_TO_REF:-HEAD} --not --remotes"'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: trufflehog-history
        name: trufflehog (full history)
        entry: .github/scripts/trufflehog-scan.sh history
        language: system
        pass_filenames: false
        stages: [pre-push]
default_install_hook_types:
  - pre-commit
  - pre-push
